name: PR Body Check

# Milestone H1 (docs/milestones.md, rule 8). Every PR states how it was checked
# from the last release's on-disk state, against real engine output, and what
# nearby code it can break. This fails when any of those sections of
# .github/pull_request_template.md is missing or holds only the template's
# comments.

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

jobs:
  body:
    name: PR body sections
    runs-on: ubuntu-latest
    steps:
      - name: Check required sections
        env:
          # Passed through the environment, never interpolated into the script.
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: python
        run: |
          import os
          import re
          import sys

          REQUIRED = [
              "업그레이드 경로",
              "실제 출력으로 확인한 것",
              "맞물리는 코드와 깨질 수 있는 것",
          ]

          body = os.environ.get("PR_BODY") or ""
          body = re.sub(r"<!--.*?-->", "", body, flags=re.S).replace("\r\n", "\n")
          sections = {}
          current = None
          for line in body.split("\n"):
              heading = re.match(r"^#{2,3}\s+(.+?)\s*#*\s*$", line)
              if heading:
                  current = heading.group(1).strip()
                  sections.setdefault(current, [])
              elif current is not None:
                  sections[current].append(line)

          problems = []
          for name in REQUIRED:
              if name not in sections:
                  problems.append(f'missing section "## {name}"')
              elif not "\n".join(sections[name]).strip(" \n\t-*"):
                  problems.append(f'section "## {name}" is empty')

          for problem in problems:
              print(f"::error::PR body: {problem}")
          if problems:
              print("Fill in the sections from .github/pull_request_template.md.")
              sys.exit(1)
          print("All required sections are filled in.")
