name: mobile_rag_engine
description: Build local/on-device RAG in Flutter with Dart APIs, offline semantic search, HNSW+BM25 hybrid retrieval, and text-layer PDF indexing.
version: 0.19.1
homepage: https://github.com/dev07060/mobile_rag_engine
repository: https://github.com/dev07060/mobile_rag_engine
issue_tracker: https://github.com/dev07060/mobile_rag_engine/issues

topics:
  - flutter
  - rag
  - on-device
  - semantic-search
  - vector-database

environment:
  sdk: ^3.9.2
  flutter: ">=3.9.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: ^2.11.1
  rag_engine_flutter: ^0.18.4
  path_provider: ^2.1.5
  flutter_onnxruntime: ^1.8.0
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  freezed: ^3.2.4
  build_runner: ^2.4.8
  mocktail: ^1.0.4
  # Used only by native migration_meta tests to tamper with sqlite state.
  sqlite3: ^2.4.0

flutter:
  uses-material-design: true
